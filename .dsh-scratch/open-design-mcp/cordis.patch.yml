# OpenDesign (open-design.ai) exposes its local daemon to coding agents over a
# stdio MCP server. The upstream plugin manifest ships `{ "command": "od" }`,
# which cannot work on Linux/WSL2: PATH resolves `od` to coreutils' octal-dump
# binary at /usr/bin/od before OpenDesign's CLI. Upstream's own WSL2 guide adds
# a ~/.local/bin/od wrapper to win that race; this workspace sandbox cannot
# write outside the session workspace, so the absolute path to the daemon's
# own bin entry is pinned instead. Same binary, no PATH dependency.
- insert:
    - id: open-design-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: open_design
        transport: stdio
        command: >-
          /home/xuyinjie/Web/xuyinjiesh.github.io/.dsh-scratch/open-design/node_modules/.bin/od
        args:
          - mcp
          - --daemon-url
          - http://127.0.0.1:7456
        cwd: /home/xuyinjie/Web/xuyinjiesh.github.io/.dsh-scratch/open-design
        failOnStartupError: true
